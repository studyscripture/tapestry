    <style>
        :root {
            --bg-color: #02040a;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent-gold: #d4af37;
            --accent-blue: #4fa8fb;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.7;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(212, 175, 55, 0.03), transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(79, 168, 251, 0.03), transparent 40%);
            background-attachment: fixed;
        }

        /* Ethereal Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            animation: float 30s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: rgba(212, 175, 55, 0.04); }
        .orb-2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: rgba(79, 168, 251, 0.03); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        /* Header */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            animation: fadeInDown 1.2s ease;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* Main Container */
        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 35px;
            padding: 40px 0;
            transition: opacity 0.4s ease;
        }

            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card i {
            font-size: 4rem;
            background: -webkit-linear-gradient(45deg, var(--accent-gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(212,175,55,0.4));

        .card h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #fff;

            color: var(--accent-gold);

            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);

        .card p {
            color: var(--text-muted);
            font-size: 1rem;
        }

            display: none;
            opacity: 0;
            padding: 20px 0 100px;
        }

            color: var(--accent-gold);

            color: var(--bg-color);

            margin-bottom: 20px;

            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);

            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 35px;
        }

        .evidence-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent-gold);
            padding: 40px;
            border-radius: 0 20px 20px 0;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .evidence-box:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(10px);
            border-left-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .evidence-box .number {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: rgba(212, 175, 55, 0.08);
            position: absolute;
            top: 10px;
            right: 20px;
            font-weight: 800;
            line-height: 1;
            z-index: 0;
        }

        .evidence-box h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #fff;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;

            line-height: 1.3;

        .evidence-box p {
            color: var(--text-muted);
            font-size: 1.05rem;
            position: relative;
            z-index: 1;
            line-height: 1.8;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .detail-header h2 { font-size: 3rem; }
            .evidence-grid { grid-template-columns: 1fr; }
            .evidence-box { padding: 30px; }
            .evidence-box .number { font-size: 3rem; }
        }

        // Initialize the Grid

        const detailView = document.getElementById('detail-view');
        const evidenceContainer = document.getElementById('evidence-container');

        function renderGrid() {
            gridContainer.innerHTML = '';
            truthData.forEach((religion, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animation = `fadeInUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) ${index * 0.1}s forwards`;
                card.style.opacity = '0';
                card.innerHTML = `
                    <i class="${religion.icon}"></i>
                    <h2>${religion.title}</h2>
                    <div class="evidence-count">${religion.evidence.length} Profound Arguments</div>
                    <p>Click to explore the massive index of evidence.</p>
                `;
                card.onclick = () => showDetails(religion.id);
                gridContainer.appendChild(card);
            });
        }

        function showDetails(id) {
            const data = truthData.find(item => item.id === id);
            
            // Fade out grid
            gridContainer.style.opacity = '0';
            setTimeout(() => {
                gridContainer.style.display = 'none';
                
                // Populate Details
                document.getElementById('detail-title').innerText = data.title;
                document.getElementById('detail-subtitle').innerText = data.subtitle;
                document.getElementById('detail-icon').className = data.icon;
                
                evidenceContainer.innerHTML = '';
                data.evidence.forEach((ev, index) => {
                    const box = document.createElement('div');
                    box.className = 'evidence-box';
                    // Cap animation delay so massive lists don't take forever to load
                    let delay = Math.min(index * 0.05, 0.5);
                    box.style.animation = `fadeInUp 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) ${delay}s forwards`;
                    box.style.opacity = '0';
                    box.innerHTML = `
                        <div class="number">${index + 1}</div>
                        <h3><i class="fa-solid fa-check-circle" style="color: var(--accent-blue); font-size: 1.2rem;"></i> ${ev.title}</h3>
                        <p>${ev.text}</p>
                    `;
                    evidenceContainer.appendChild(box);
                });

                // Show details
                detailView.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                setTimeout(() => {
                    detailView.style.opacity = '1';
                }, 50);
            }, 300); // Faster transition
        }

        function showGrid() {
            // Fade out details
            detailView.style.opacity = '0';
            setTimeout(() => {
                detailView.style.display = 'none';
                
                // Show grid
                gridContainer.style.display = 'grid';
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(() => {
                    gridContainer.style.opacity = '1';
                }, 50);
            }, 300); // Faster transition
        }

        // Run on load
        window.onload = renderGrid;

    </script>
